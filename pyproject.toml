[project]
name = "agent-ia"
version = "0.1.0"
description = "Copiloto personal de gestión de conocimiento y estudio — Agent IA"
readme = "README.md"
authors = [
    { name = "Miguel Ángel Polo Castro", email = "miguelpolo415@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    # --- API Gateway ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # --- HUD ---
    "streamlit>=1.45.0",
    # --- LLM & Embeddings ---
    "ollama>=0.5.0",
    # --- Vector Store ---
    "chromadb>=1.0.0",
    # --- Notion ---
    "notion-client>=2.3.0",
    # --- HTTP client ---
    "httpx>=0.28.0",
    # --- Settings & Config ---
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    # --- Testing ---
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[project.scripts]
agent-api = "agent_ia.entrypoints.api.main:start"
agent-hud = "agent_ia.entrypoints.hud.app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:chromadb.*:",
    "ignore::DeprecationWarning:opentelemetry.*:",
]
